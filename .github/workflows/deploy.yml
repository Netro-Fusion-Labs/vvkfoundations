name: Deploy to GoDaddy cPanel (FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would be uploaded without changing the server"
        type: boolean
        default: true

# Never run two deployments at once; let a running transfer finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No bundler: the site is plain static HTML/CSS/JS. The only "build"
      # is cache-busting: Cloudflare and browsers cache JS/CSS for a month, so
      # rewrite every ?v=<x> on .js/.css/.json URLs to this commit's SHA.
      # Runs on the runner only; the repository files are not modified.
      - name: Stamp asset version (cache-busting)
        run: |
          VERSION="${GITHUB_SHA::8}"
          FILES=$(grep -rlE '\.(js|css|json)\?v=' index.html 404.html assets --include='*.html' --include='*.js' || true)
          echo "$FILES" | xargs -r perl -pi -e "s/(\.(?:js|css|json))\?v=[0-9A-Za-z.]+/\$1?v=${VERSION}/g"
          echo "Stamped v=${VERSION} into $(echo "$FILES" | wc -l) files"
          # Fail if any stale version string survived.
          if grep -rnE "\.(js|css|json)\?v=" index.html 404.html assets | grep -v "v=${VERSION}"; then
            echo "Unstamped asset versions found"; exit 1
          fi

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          # The FTP account is locked to /home/<user>/public_html/vvkfoundation.in,
          # so its root (./) is the site folder. If you use a broader account
          # instead, set the repo variable FTP_SERVER_DIR to /public_html/vvkfoundation.in/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Providing `exclude` replaces the action's defaults, so Git and
          # node_modules entries are listed explicitly below.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .gitignore
            .htaccess
            .env*
            **/.env*
            **/.DS_Store
            .ftpquota
            *.zip
            **/*.zip
            Backup_19_nov/**
            server.py
            serve.json
            Code.gs
            docs/**
            README*
            .well-known/**
            cgi-bin/**
